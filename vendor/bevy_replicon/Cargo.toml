[package]
name = "bevy_replicon"
version = "0.44.1"
authors = ["Hennadii Chernyshchyk <genaloner@gmail.com>", "koe <ukoe@protonmail.com>"]
edition = "2024"
description = "A server-authoritative replication crate for Bevy"
readme = "README.md"
repository = "https://github.com/simgine/bevy_replicon"
keywords = ["bevy", "multiplayer", "netcode", "replication", "server-authoritative"]
categories = ["game-development", "network-programming"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--cfg", "docsrs"]
all-features = true

[dependencies]
bevy = { workspace = true, features = ["bevy_state"] }
log = "0.4"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
variadics_please.workspace = true
typeid = "1.0"
bytes.workspace = true
serde.workspace = true
bitflags = { version = "2.6", features = ["serde"] }
smallbitvec = "2.6"
smallvec.workspace = true
postcard = { workspace = true, features = ["experimental-derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
deterministic-hash = "1.0.2"

[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr")))'.dependencies]
bytes = { workspace = true, features = ["extra-platforms"] }

[features]
default = ["client", "server", "world_serialization"]
client = []
server = []
client_diagnostics = ["client"]
world_serialization = ["bevy/bevy_world_serialization"]
scene = ["bevy/bevy_world_serialization"]

[lints]
workspace = true